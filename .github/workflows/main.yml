name: Keep Alive
on:
  schedule:
    # Runs every 10 minutes to prevent Render free-tier sleep
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: |
          curl -sS https://freshsales-mcp-server-82li.onrender.com/health || true
