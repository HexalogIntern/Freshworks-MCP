services:
  - type: web
    name: freshsales-mcp-server
    env: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRESHSALES_API_KEY
        sync: false
      - key: FRESHSALES_DOMAIN
        sync: false
      - key: FRESHSALES_DEFAULT_CONTACTS_VIEW_ID
        sync: false
      - key: FRESHSALES_DEFAULT_DEALS_VIEW_ID
        sync: false
      - key: OAUTH_CLIENT_ID
        sync: false
      - key: OAUTH_CLIENT_SECRET
        sync: false
      - key: DAILY_CALL_LIMIT
        value: "200"
      - key: APPROVAL_TTL_SECONDS
        value: "300"
      - key: RESET_TIMEZONE
        value: UTC
      - key: MCP_ALLOWED_ORIGINS
        value: https://claude.ai
      - key: MCP_ALLOWED_HOSTS
        sync: false
      - key: FRESHSALES_MAX_429_RETRIES
        value: "1"
      - key: FRESHSALES_MAX_RETRY_WAIT_MS
        value: "2000"
      - key: LOCAL_RATE_LIMIT_PER_MINUTE
        value: "600"
      - key: PIPELINE_SUMMARY_MAX_PAGES
        value: "5"
      - key: CONTACTS_SCAN_MAX_PAGES
        value: "10"
      - key: DEALS_SCAN_MAX_PAGES
        value: "10"
      - key: FIELD_SCHEMA_CACHE_TTL_MS
        value: "86400000"
      - key: ANALYTICS_REPORT_CACHE_TTL_MS
        value: "86400000"
      - key: FRESHSALES_ANALYTICS_REPORTS_PATH
        value: api/reports
      - key: FRESHSALES_ANALYTICS_REPORT_EXPORT_PATH_TEMPLATE
        value: api/reports/{report_id}/export
      - key: FRESHSALES_ANALYTICS_EXPORT_STATUS_PATH_TEMPLATE
        value: api/reports/exports/{export_id}
